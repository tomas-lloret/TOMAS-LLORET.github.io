        location: Boulder, CO, USA
        start_date: 2023-01
        end_date: 2023-04
        summary: Three-month research stay at McLeod's Lab under the supervision of Prof. Robert McLeod, focused on physical and chemical phenomena during holographic recording, including polymerization, diffusion, scattering, and haze, as well as transmission and reflection diffraction gratings.

