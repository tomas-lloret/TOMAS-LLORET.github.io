        location: Dublin, Ireland
        start_date: 2024-03
        end_date: 2024-06
        summary: Three-month research stay at FOCAS under the supervision of Prof. Izabela Naydenova and Prof. Suzanne Martin, focused on the temperature dependence and optical characterization of holographic elements recorded in different photopolymer materials.

      - company: University of Colorado Boulder
