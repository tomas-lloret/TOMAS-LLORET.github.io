        position: Junior Researcher
        location: Alicante, Spain
        start_date: 2025-04
        end_date: 2025-12
        summary: Research on holographic optical elements and photopolymer-based devices for augmented-reality applications.

    Research Stays:
      - company: University of Granada
        position: Visiting Researcher (upcoming)
        location: Granada, Spain
        start_date: 2026-09
        end_date: 2026-12
        summary: Three-month research stay at the Department of Optics under the supervision of Prof. José Antonio Díaz Navas, focused on optical modelling, optical system design, and image quality analysis.

